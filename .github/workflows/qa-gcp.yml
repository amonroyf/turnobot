name: QA GCP (manual)

# Suite contra el proyecto GCP de práctica. No corre en cada PR: escribe datos
# reales y necesita credenciales (Workload Identity Federation).
#
# Requisitos en el repositorio:
#   - secrets.WIF_PROVIDER y secrets.WIF_SERVICE_ACCOUNT (ya usados por ci.yml)
#   - secrets.GCP_TEST_FIREBASE_API_KEY para el login de los tests Go
#   - variable/secret opcional con el project ID; por defecto el de práctica

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite a ejecutar'
        type: choice
        options:
          - e2e-safe
          - e2e-full
          - api
          - backend
        default: e2e-safe
      project_id:
        description: 'Proyecto GCP dedicado (vacío = stalwart-coast-439901-d0)'
        required: false
        default: 'stalwart-coast-439901-d0'

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-gcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gcp:
    name: QA contra GCP (${{ inputs.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_TARGET: gcp
      E2E_ALLOW_GCP: '1'
      E2E_PROJECT_ID: ${{ inputs.project_id }}
      GCP_TEST_PROJECT_ID: ${{ inputs.project_id }}
      GCP_TEST_ALLOW_WRITES: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar en GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: E2E seguro
        if: inputs.suite == 'e2e-safe'
        working-directory: frontend
        run: npm run test:e2e:gcp:safe

      - name: E2E completo
        if: inputs.suite == 'e2e-full'
        working-directory: frontend
        run: npm run test:e2e:gcp

      - name: API (Newman)
        if: inputs.suite == 'api'
        run: ./scripts/run-api-gcp.sh

      - name: Backend Go contra GCP
        if: inputs.suite == 'backend'
        working-directory: backend
        env:
          GCP_TEST_FIREBASE_API_KEY: ${{ secrets.GCP_TEST_FIREBASE_API_KEY }}
        run: go test ./... -count=1

      - name: Subir reportes si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-gcp-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/allure-results/
            newman-report.json
