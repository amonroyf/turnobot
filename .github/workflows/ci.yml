name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: stalwart-coast-439901-d0
  REGION: us-central1
  SERVICE: turnobot

jobs:
  # ── Backend ──────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Test unitario (sin emulador)
        working-directory: backend
        run: go test ./... -v -count=1

  # ── Backend handlers (emulador Firestore) ──────────────────
  backend-handlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar firebase-tools
        run: npm install -g firebase-tools
      - name: Levantar emulador Firestore
        run: |
          printf '{"emulators":{"firestore":{"port":8090},"ui":{"enabled":false}}}' > firebase.emu.json
          (npx firebase emulators:start --only firestore --project ${{ env.PROJECT_ID }} --config firebase.emu.json > /tmp/emu.log 2>&1 &) 
          for i in $(seq 1 30); do
            grep -q "All emulators ready" /tmp/emu.log && break
            sleep 5
          done
          grep -q "All emulators ready" /tmp/emu.log
      - name: Test handlers (con emulador)
        working-directory: backend
        run: FIRESTORE_EMULATOR_HOST=127.0.0.1:8090 go test ./... -v -count=1

  # ── Frontend ─────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # ── Deploy (solo en push a main) ────────────────────────
  deploy:
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy Backend
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --source backend \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Frontend
        working-directory: frontend
        run: |
          npm ci
          VITE_API_URL=${{ secrets.VITE_API_URL }} \
          npm run build
          export TOKEN=$(gcloud auth print-access-token)
          SITE=turnobot-web node ../scripts/deploy-hosting.mjs
