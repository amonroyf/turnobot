name: Turnobot Test Harness

# Puerta unificada pre-deploy: emulador Firestore + Go tests + backend +
# frontend + Playwright (todos los specs) vía ./harness.sh.
# ci.yml mantiene jobs rápidos por área; este workflow es el gate E2E completo.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar firebase-tools y browsers
        working-directory: frontend
        run: |
          npm install -g firebase-tools
          npx playwright install chrome --with-deps

      - name: Ejecutar Test Harness
        run: |
          chmod +x harness.sh
          ./harness.sh

      - name: Subir logs y reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: |
            .harness-emulator.log
            .harness-backend.log
            .harness-frontend.log
            frontend/test-results/
