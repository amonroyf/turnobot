name: QA Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests (Go) + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Start Firestore emulator
        run: |
          npm install -g firebase-tools
          npx firebase-tools emulators:start --config firebase.emu.json --project demo-test --only firestore,auth &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:8090 >/dev/null && break; sleep 2; done
      - name: Run Go tests
        working-directory: backend
        env:
          GCP_PROJECT_ID: demo-test
          EMPLOYEE_TOKEN_KEY: ci-employee-token-key-minimum-32-chars!!
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8090
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9098
          CRON_SECRET: ci-cron
          FRONTEND_URL: http://localhost:5173
        run: |
          go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -5
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out

  frontend-unit:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: frontend
        run: |
          npm ci
          npm run test

  api:
    name: API tests (Newman)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Start emulator
        run: |
          npm install -g firebase-tools
          npx firebase-tools emulators:start --config firebase.emu.json --project demo-test --only firestore,auth &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:8090 >/dev/null && break; sleep 2; done
      - name: Seed data
        working-directory: backend
        env:
          GCP_PROJECT_ID: demo-test
          EMPLOYEE_TOKEN_KEY: ci-employee-token-key-minimum-32-chars!!
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8090
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9098
          SEED_ALLOW_PROD: '1'
        run: go run seed.go
      - name: Build & run backend
        working-directory: backend
        env:
          GCP_PROJECT_ID: demo-test
          EMPLOYEE_TOKEN_KEY: ci-employee-token-key-minimum-32-chars!!
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8090
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9098
          CRON_SECRET: ci-cron
          FRONTEND_URL: http://localhost:5173
          PORT: '8080'
        run: |
          go build -o /tmp/turnobot .
          /tmp/turnobot &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:8080/health >/dev/null && break; sleep 1; done
      - name: Get Firebase token
        working-directory: tests/api
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9098
          GCP_PROJECT_ID: demo-test
        run: |
          node get-token.mjs > /tmp/token.txt
          echo "TOKEN=$(cat /tmp/token.txt)" >> $GITHUB_ENV
      - name: Run Newman
        run: |
          npm install -g newman
          newman run tests/api/turnobot.postman_collection.json \
            -e tests/api/turnobot.postman_environment.json \
            --env-var "idToken=$TOKEN" \
            --env-var "baseUrl=http://localhost:8080" \
            --reporters cli,json \
            --reporter-json-export newman-report.json

  e2e:
    name: E2E (Playwright) + Allure
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Start emulator
        run: |
          npm install -g firebase-tools
          npx firebase-tools emulators:start --config firebase.emu.json --project demo-test --only firestore,auth &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:8090 >/dev/null && break; sleep 2; done
      - name: Seed data
        working-directory: backend
        env:
          GCP_PROJECT_ID: demo-test
          EMPLOYEE_TOKEN_KEY: ci-employee-token-key-minimum-32-chars!!
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8090
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9098
          SEED_ALLOW_PROD: '1'
        run: |
          go mod download
          go run seed.go
      - name: Build & run backend
        working-directory: backend
        env:
          GCP_PROJECT_ID: demo-test
          EMPLOYEE_TOKEN_KEY: ci-employee-token-key-minimum-32-chars!!
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8090
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9098
          CRON_SECRET: ci-cron
          FRONTEND_URL: http://localhost:5173
          PORT: '8080'
        run: |
          go build -o /tmp/turnobot .
          /tmp/turnobot &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:8080/health >/dev/null && break; sleep 1; done
      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_TARGET: local
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8090
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9098
        run: npx playwright test
      - name: Generate Allure report
        if: always()
        working-directory: frontend
        run: |
          npx --yes allure-commandline generate allure-results --clean -o allure-report || true
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: frontend/allure-report

  perf:
    name: Performance (k6)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6
      - name: Run k6
        run: k6 run tests/perf/load.js -e BASE_URL=http://localhost:8080 -e SLUG=mi-negocio || true